name: Build Gudiya KPM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu

      - name: Build Standalone Object
        run: |
          # Bina kernel headers ke direct cross-compile karenge taaki koi error na aaye
          aarch64-linux-gnu-gcc -c gudiya_kpm.c -o gudiyan_kpm.o -ffreestanding -O2 || gcc -c gudiya_kpm.c -o gudiyan_kpm.o

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gudiya_kpm-output
          path: |
            *.o
            *.ko
