name: Build Gudiya KPM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu

      - name: Compile Kpm Module
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- || gcc -c gudiya_kpm.c -o gudiya_kpm.o

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gudiya_kpm-output
          path: |
            *.ko
            *.o
