name: Build Gudiya KPM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential linux-headers-$(uname -r) gcc-aarch64-linux-gnu

      - name: Compile Module
        run: |
          # Linux headers ke sath standard module build command
          make -C /lib/modules/$(uname -r)/build M=$(PWD) modules ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- || gcc -c gudiyan_test.c

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gudiya_kpm-output
          path: |
            *.ko
            *.o
            *.mod.o
