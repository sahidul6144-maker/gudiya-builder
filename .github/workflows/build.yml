name: Build Gudiya KPM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu

      - name: Compile Direct Object
        run: |
          # Kernel Makefile ko bypass karke direct ARM64 object compile karenge
          aarch64-linux-gnu-gcc -c gudiya_kpm.c -o gudiyakpm.o -ffreestanding -nostdinc || gcc -c gudiya_kpm.c -o gudiyakpm.o

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gudiya_kpm-output
          path: |
            *.o
            *.ko
